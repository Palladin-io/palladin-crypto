name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: crypto-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish trusted npm release
    if: github.repository == 'Palladin-io/palladin-crypto'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read # check out and verify the tagged source
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the signed release tag is on main
        env:
          EVENT_SOURCE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$EVENT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG_REF="refs/tags/$RELEASE_TAG"
          TAG_OBJECT_SHA="$(git rev-parse "$TAG_REF^{tag}")"
          SOURCE_SHA="$(git rev-parse "$TAG_REF^{commit}")"
          [[ "$TAG_OBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EVENT_SOURCE_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" \
            | RELEASE_TAG="$RELEASE_TAG" SOURCE_SHA="$SOURCE_SHA" node -e '
                const fs = require("node:fs");
                const tag = JSON.parse(fs.readFileSync(0, "utf8"));
                const valid = tag.verification?.verified === true
                  && tag.tag === process.env.RELEASE_TAG
                  && tag.object?.type === "commit"
                  && tag.object?.sha === process.env.SOURCE_SHA;
                if (!valid) process.exit(1);
              '
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run oss:check
      - run: npm run package:check
      - name: Publish through npm trusted publishing
        run: npm publish --access public --provenance
