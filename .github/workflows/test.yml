name: test

on:
  push:
    branches: [main]
  pull_request:

# Fork-safe: read-only, no secrets used.
permissions:
  contents: read

concurrency:
  group: crypto-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, build, test, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify OSS metadata
        run: npm run oss:check

      - name: Verify package contents
        run: npm run package:check
